name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: findaries-mod
          path: build/libs/*.jar

      - name: Server self-test
        run: |
          set -o pipefail
          mkdir -p run
          echo eula=true > run/eula.txt
          printf 'max-tick-time=-1\nonline-mode=false\nlevel-seed=20240613\nview-distance=4\n' > run/server.properties
          FD_SMOKE=1 timeout 1200 ./gradlew runServer --console=plain 2>&1 | tee server.log
          grep -q "FINDARIES SMOKE: OK" server.log

      - name: Client self-test
        id: client
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p run
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:10\nsimulationDistance:6\ntutorialStep:none\nsoundCategory_master:0.0\nnarrator:0\nfov:0.0\nmaxFps:60\ngraphicsMode:1\nrenderClouds:"true"\n' > run/options.txt
          rm -rf run/saves/fd_smoke
          FD_SMOKE=1 timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain 2>&1 | tee client.log
          grep -q "FINDARIES CLIENT SMOKE: OK" client.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test
          path: |
            *.log
            run/screenshots/*.png
            run/logs/latest.log
            run/crash-reports/*
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          post() { gh api "repos/$REPO/commits/$SHA/comments" -f "body=$1" > /dev/null 2>&1; }
          for f in build.log server.log client.log; do
            [ -f "$f" ] || continue
            post "LOG:$f:$(tail -c 6000 "$f")"
          done
          sudo apt-get install -y -qq imagemagick > /dev/null 2>&1
          mkdir -p /tmp/thumbs
          for png in run/screenshots/*.png; do
            [ -f "$png" ] || continue
            n=$(basename "$png" .png)
            convert "$png" -resize 560x315 -quality 62 "/tmp/thumbs/$n.jpg" 2>/dev/null || continue
            post "SHOT:$n:$(base64 -w0 "/tmp/thumbs/$n.jpg")"
          done
          exit 0
