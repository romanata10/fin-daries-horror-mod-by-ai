name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: findiaries-mod
          path: build/libs/*.jar

      - name: Server self-test
        run: |
          set -o pipefail
          mkdir -p run
          echo eula=true > run/eula.txt
          printf 'max-tick-time=-1\nonline-mode=false\nlevel-seed=20240613\nview-distance=4\n' > run/server.properties
          FD_SMOKE=1 timeout 1200 ./gradlew runServer --console=plain 2>&1 | tee server.log
          grep -q "FINDIARIES SMOKE: OK" server.log

      - name: Client self-test
        id: client
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p run
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:10\nsimulationDistance:6\ntutorialStep:none\nsoundCategory_master:0.0\nnarrator:0\nfov:0.0\nmaxFps:60\ngraphicsMode:1\nrenderClouds:"true"\n' > run/options.txt
          rm -rf run/saves/fd_smoke
          FD_SMOKE=1 timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain 2>&1 | tee client.log
          grep -q "FINDIARIES CLIENT SMOKE: OK" client.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test
          path: |
            *.log
            run/screenshots/*.png
            run/logs/latest.log
            run/crash-reports/*

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          post() { jq -Rs '{body: .}' | gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input - > /dev/null || true; }
          for f in build.log server.log client.log; do
            if [ -f $f ]; then { echo "LOG $f"; grep -n -A4 "error:" $f | head -150; grep -n "FINDIARIES\|Exception\|Caused by\|FAILED\|at com.findiaries" $f | tail -60; echo ---; tail -15 $f; } | cut -c1-500 | post; fi
          done
          sudo apt-get install -y -qq imagemagick > /dev/null 2>&1 || true
          for f in run/screenshots/{01,06,2,30}*.png; do
            if [ -f "$f" ]; then { echo "IMG $(basename $f)"; convert "$f" -resize 560x315 -quality 55 jpg:- | base64 -w0; } | post; fi
          done
