name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: findiaries-mod
          path: build/libs/*.jar

      - name: Server self-test
        run: |
          set -o pipefail
          mkdir -p run
          echo eula=true > run/eula.txt
          printf 'max-tick-time=-1\nonline-mode=false\nlevel-seed=20240613\nview-distance=4\n' > run/server.properties
          FD_SMOKE=1 timeout 1200 ./gradlew runServer --console=plain 2>&1 | tee server.log
          grep -q "FINDIARIES SMOKE: OK" server.log

      - name: Client self-test
        id: client
        continue-on-error: true
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick > /dev/null
          mkdir -p run
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:10\nsimulationDistance:6\ntutorialStep:none\nsoundCategory_master:0.0\nnarrator:0\nfov:0.0\nmaxFps:60\ngraphicsMode:1\nrenderClouds:"true"\n' > run/options.txt
          rm -rf run/saves/fd_smoke
          FD_SMOKE=1 timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain 2>&1 | tee client.log
          grep -q "FINDIARIES CLIENT SMOKE: OK" client.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test
          path: |
            *.log
            run/screenshots/*.png
            run/logs/latest.log
            run/crash-reports/*

      - name: Report
        if: always()
        run: |
          post() { # title file
            { echo "### $1"; echo; echo '```'; tail -c 55000 "$2"; echo '```'; } > body.md
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md > /dev/null || true
          }
          if [ -f build.log ]; then grep -n -B2 -A12 -E "error:|warning: \[|FAILED|What went wrong" build.log | head -c 50000 > build.short || true; [ -s build.short ] || tail -n 40 build.log > build.short; post "build" build.short; fi
          if [ -f server.log ]; then grep -n -E "FINDIARIES|findiaries|ERROR|Exception|Caused by|^\s+at com\.findiaries|FATAL|Crash|crash" server.log | head -c 50000 > server.short || true; post "server" server.short; fi
          if [ -f client.log ]; then grep -n -E "FINDIARIES|findiaries|ERROR|Exception|Caused by|^\s+at com\.findiaries|FATAL|Crash|crash|Missing|Unable to" client.log | head -c 50000 > client.short || true; post "client (${{ steps.client.outcome }})" client.short; fi
          for f in run/crash-reports/*; do [ -f "$f" ] && { head -c 30000 "$f" > crash.short; post "crash $(basename "$f")" crash.short; }; done
          for f in run/screenshots/*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 640x360 -quality 62 shot.jpg
            { echo "### shot $(basename "$f" .png)"; echo; echo '```'; base64 -w 0 shot.jpg; echo; echo '```'; } > body.md
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md > /dev/null || true
          done
