name: release

# Pushing a tag like v0.1.0 builds the mod and publishes a GitHub release with the .jar attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --console=plain
      - name: Publish release
        run: |
          gh release create "${{ github.ref_name }}" build/libs/*.jar \
            --repo "${{ github.repository }}" \
            --title "Fin Daries Horror ${{ github.ref_name }} (Forge 1.20.1)" \
            --notes-file .github/release-notes.md
